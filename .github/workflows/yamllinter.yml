---

name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: ['**']
    paths:
      - '**.yaml'
      - '**.yml'
  pull_request:
    branches: [master, release-*]
    paths:
      - '**.yaml'
      - '**.yml'
  workflow_dispatch:

jobs:
  yamllinter:
    name: 'YAML Linter'
    uses: simplesamlphp/simplesamlphp-test-framework/.github/workflows/reusable_yamllinter.yml@2f8980a72346dd91d9d6b2adc89e589dc1736238
